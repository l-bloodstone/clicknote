<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>clickNote</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            background-size: 400% 400%;
            /* animation: gradientShift 15s ease infinite; */
            overflow: hidden;
            position: relative;
        }

        /* Soft floating orbs for depth */
        body::before,
        body::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
            z-index: 0;
        }

        body::before {
            width: 400px;
            height: 400px;
            background: #7b2cbf;
            top: -100px;
            left: -100px;
        }

        body::after {
            width: 350px;
            height: 350px;
            background: #00d4ff;
            bottom: -80px;
            right: -80px;
        }

        /* @keyframes gradientShift { */
        /*     0% { background-position: 0% 50%; } */
        /*     50% { background-position: 100% 50%; } */
        /*     100% { background-position: 0% 50%; } */
        /* } */

        .glass-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 380px;
            padding: 2.5rem 2rem;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.15);
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .glass-card h1 {
            color: #fff;
            font-size: 1.75rem;
            font-weight: 600;
            text-align: center;
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .glass-card p {
            color: rgba(255, 255, 255, 0.65);
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 0.75rem;
        }

        input {
            width: 100%;
            padding: 0.95rem 1.1rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 14px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.45);
        }

        input:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 0 3px rgba(123, 44, 191, 0.25);
        }

        button {
            width: 100%;
            padding: 1rem;
            margin-top: 0.5rem;
            background: linear-gradient(135deg, #7b2cbf, #00d4ff);
            border: none;
            border-radius: 14px;
            color: #fff;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(123, 44, 191, 0.4);
            letter-spacing: 0.3px;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(123, 44, 191, 0.55);
            filter: brightness(1.1);
        }

        button:active:not(:disabled) {
            transform: translateY(0);
        }

        /* Disabled state */
        button:disabled {
            background: linear-gradient(135deg, #4a3a6b, #3a5a6b);
            color: rgba(255, 255, 255, 0.45);
            cursor: not-allowed;
            box-shadow: none;
            opacity: 0.6;
            transform: none;
            filter: grayscale(0.4);
        }

        /* Subtle shine effect */
        .glass-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            border-radius: 24px 24px 0 0;
        }
    </style>
</head>
<body>
    <div class="glass-card">
        <h1>clickNote</h1>
        <p>Create a new encrypted note</p>
        
        <input 
            placeholder="Note Name" 
            id="noteId" 
            type="text" 
            name="notename" 
            value=""
            autocomplete="off"
        >
        
        <input 
            placeholder="Password" 
            id="password" 
            type="password" 
            name="password" 
            value=""
        >
        
        <button id="create_button">Create</button>
    </div>

    <script src="./scrypt.js"></script>
    <script src="./create_new_note.js"></script>
</body>
</html>
